name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Lint and the shared spec in Java, Python and JavaScript
        run: make setup lint test
      - name: Seeded bugs (prints a notice with the result)
        run: |
          set -o pipefail
          make bugs | tee bugs.txt || { echo "::error title=seeded bugs::$(grep '^RESULT' bugs.txt || tail -n 1 bugs.txt)"; exit 1; }
          echo "::notice title=seeded bugs::$(grep '^RESULT' bugs.txt)"
      - name: Known-vulnerability audit (OSV.dev, pip-audit, npm audit)
        run: make audit
