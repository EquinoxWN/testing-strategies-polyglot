name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Lint and the shared spec in Java, Python and JavaScript
        run: make setup lint test
      - name: Seeded bugs (prints a notice with the result)
        run: |
          set -o pipefail
          make bugs | tee bugs.txt || { echo "::error title=seeded bugs::$(grep '^RESULT' bugs.txt || tail -n 1 bugs.txt)"; exit 1; }
          echo "::notice title=seeded bugs::$(grep '^RESULT' bugs.txt)"
      - name: Known-vulnerability audit (OSV.dev, pip-audit, npm audit)
        run: make audit
