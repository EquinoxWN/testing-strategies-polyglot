# Twenty seeded bugs. Each is an exact find-and-replace in one source file (the find text must occur
# exactly once) and names a witness row of spec/vectors.tsv whose answer the bug changes.
# `python scripts/bugs.py verify` applies each bug to a scratch copy and runs the spec through it;
# `python scripts/bugs.py materialize DIR` writes a tree with all twenty applied (generated on demand, not kept as a branch).
# Strings are TOML literal strings: backslashes are taken as written.

[[bug]]
id = "J1"
language = "java"
file = "src/main/java/portfolio/tsp/Money.java"
category = "rounding"
title = "multiply rounds half up instead of half even"
find = 'if (cmp > 0 || (cmp == 0 && q.testBit(0))) {'
replace = 'if (cmp >= 0) {'
witness = "m1"

[[bug]]
id = "J2"
language = "java"
file = "src/main/java/portfolio/tsp/Money.java"
category = "overflow"
title = "add skips the range check"
find = 'return checked(BigInteger.valueOf(a).add(BigInteger.valueOf(b)));'
replace = 'return a + b;'
witness = "a3"

[[bug]]
id = "J3"
